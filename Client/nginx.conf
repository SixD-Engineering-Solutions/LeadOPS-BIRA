# Serves the React build and forwards /api/* to the API container, so the
# browser only ever talks to one origin. Put an HTTPS reverse proxy in front.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Documents upload up to 10 MB (multer limit) — allow a little overhead.
  client_max_body_size 12m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # Look the API container up per request via Docker's internal DNS, instead
  # of once at startup: otherwise nginx refuses to start whenever the API
  # container isn't up yet (restarting, slow start) and the whole site is down.
  # With a variable in proxy_pass the /api prefix is stripped by `rewrite`.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api leadops-api:3000;

  # Live notifications (Server-Sent Events): must not be buffered, and the
  # connection stays open — the API sends a heartbeat every 25 s.
  location /api/notifications/stream {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Everything else under /api → the API, with the /api prefix stripped.
  location /api/ {
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets can be cached forever; index.html must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  # (add_header inside a location replaces the server-level ones, so the
  # security headers are repeated here.)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
