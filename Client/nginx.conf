# Serves the React build and forwards /api/* to the API container, so the
# browser only ever talks to one origin. Put an HTTPS reverse proxy in front.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Documents upload up to 10 MB (multer limit) — allow a little overhead.
  client_max_body_size 12m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # Live notifications (Server-Sent Events): must not be buffered, and the
  # connection stays open — the API sends a heartbeat every 25 s.
  location /api/notifications/stream {
    proxy_pass http://leadops-api:3000/notifications/stream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Everything else under /api → the API, with the /api prefix stripped.
  location /api/ {
    proxy_pass http://leadops-api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Hashed build assets can be cached forever; index.html must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
